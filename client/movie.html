<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фільм — Cinemix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <style>
    /* Hero фільму */
    .movie-hero {
      background: linear-gradient(to bottom, #16213e, var(--clr-bg));
      padding: 60px 0 40px;
      border-bottom: 1px solid var(--clr-border);
    }
    .movie-hero-inner {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: start;
    }
    .movie-poster {
      border-radius: var(--radius-md);
      overflow: hidden;
      aspect-ratio: 2/3;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .movie-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .movie-info {}
    .movie-genre-badge {
      display: inline-block;
      background: rgba(233,69,96,0.15);
      border: 1px solid rgba(233,69,96,0.4);
      color: var(--clr-accent);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .movie-title {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .movie-original {
      color: var(--clr-muted);
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .movie-rating-big {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .rating-score {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--clr-accent2);
    }
    .rating-stars { font-size: 1.1rem; color: var(--clr-accent2); }
    .rating-count { color: var(--clr-muted); font-size: 0.88rem; }
    .movie-meta-list {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 24px;
    }
    .meta-item {}
    .meta-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--clr-muted);
      font-weight: 600;
      margin-bottom: 3px;
    }
    .meta-value {
      font-size: 0.95rem;
      font-weight: 600;
    }
    .movie-description {
      color: var(--clr-muted);
      line-height: 1.8;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .movie-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    /* Розділи деталей */
    .details-section {
      padding: 48px 0;
      border-bottom: 1px solid var(--clr-border);
    }
    .details-section h2 {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 24px;
    }
    /* Акторський склад */
    .cast-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }
    .cast-card {
      text-align: center;
    }
    .cast-photo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 8px;
      border: 2px solid var(--clr-border);
    }
    .cast-photo img { width: 100%; height: 100%; object-fit: cover; }
    .cast-name { font-size: 0.82rem; font-weight: 600; }
    .cast-role { font-size: 0.75rem; color: var(--clr-muted); margin-top: 2px; }
    /* Відгуки */
    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .review-card {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: 20px;
    }
    .review-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .review-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--clr-accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; color: #fff;
      flex-shrink: 0;
    }
    .review-name { font-weight: 600; font-size: 0.9rem; }
    .review-date { font-size: 0.78rem; color: var(--clr-muted); }
    .review-stars { color: var(--clr-accent2); font-size: 0.85rem; margin-left: auto; }
    .review-text { color: var(--clr-muted); font-size: 0.9rem; line-height: 1.7; }
    /* Адаптив */
    @media (max-width: 768px) {
      .movie-hero-inner { grid-template-columns: 1fr; }
      .movie-poster { max-width: 200px; }
      .cast-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 480px) {
      .cast-grid { grid-template-columns: repeat(2, 1fr); }
      .movie-meta-list { gap: 14px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Cine<span>Mix</span></a>
      <nav id="main-nav">
        <ul>
          <li><a href="index.html">Головна</a></li>
          <li><a href="catalog.html" class="active">Каталог</a></li>
          <li><a href="about.html">Про нас</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="register.html" class="btn btn-primary">Приєднатись</a>
      </div>
      <button class="burger" id="burger" aria-label="Меню" aria-expanded="false" aria-controls="main-nav"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>

    <!-- Хлібні крихти -->
    <div class="container" style="padding-top:20px">
      <nav aria-label="Breadcrumb" class="breadcrumbs">
        <a href="index.html">Головна</a>
        <span aria-hidden="true">›</span>
        <a href="catalog.html">Каталог</a>
        <span aria-hidden="true">›</span>
        <span id="crumb-title" aria-current="page">Фільм</span>
      </nav>
    </div>

    <!-- Hero фільму (дані з GET /api/movies/:id) -->
    <section class="movie-hero">
      <div class="container" id="movie-root" aria-live="polite"></div>
    </section>

    <!-- Акторський склад -->
    <section class="details-section" id="cast-section" hidden>
      <div class="container">
        <h2>Акторський склад</h2>
        <div class="cast-grid" id="cast-grid"></div>
      </div>
    </section>

    <!-- Відгуки (GET/POST /api/movies/:id/reviews, PATCH/DELETE /api/reviews/:id) -->
    <section class="details-section" id="reviews-section" hidden>
      <div class="container">
        <h2>Відгуки глядачів</h2>
        <div id="review-form-box"></div>
        <div class="reviews-list" id="reviews-list" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <div class="footer-inner">
        <div>
          <div class="footer-logo">Cine<span>Mix</span></div>
          <p class="footer-desc">Знаходь фільми, які варто дивитись.</p>
        </div>
        <div class="footer-col">
          <h4>Навігація</h4>
          <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="catalog.html">Каталог</a></li>
            <li><a href="about.html">Про нас</a></li>
            <li><a href="register.html">Реєстрація</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h4>Жанри</h4>
          <ul>
            <li><a href="catalog.html?genre=scifi">Фантастика</a></li>
            <li><a href="catalog.html?genre=drama">Драма</a></li>
            <li><a href="catalog.html?genre=comedy">Комедія</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 Cinemix.</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/movie.js"></script>

</body>

</html>
