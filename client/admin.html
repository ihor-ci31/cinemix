<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Керування фільмами — Cinemix</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Cine<span>Mix</span></a>
      <nav id="main-nav">
        <ul>
          <li><a href="index.html">Головна</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="about.html">Про нас</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="register.html" class="btn btn-primary">Приєднатись</a>
      </div>
      <button class="burger" id="burger" aria-label="Меню" aria-expanded="false" aria-controls="main-nav"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main class="admin-page">
    <div class="container">
      <h1>Керування фільмами</h1>
      <p class="form-subtitle">CRUD через REST API: GET / POST / PUT / DELETE <code>/api/movies</code></p>

      <div id="admin-guard"></div>

      <div class="admin-layout" id="admin-layout" hidden>
        <section class="admin-form-card" aria-labelledby="movie-form-title">
          <h2 id="movie-form-title">Новий фільм</h2>
          <div class="form-message" id="movie-message" hidden></div>
          <form id="movie-form" novalidate>
            <div class="form-group">
              <label for="f-title">Назва *</label>
              <input type="text" id="f-title" name="title" required maxlength="200">
            </div>
            <div class="form-group">
              <label for="f-original">Оригінальна назва</label>
              <input type="text" id="f-original" name="original_title" maxlength="200">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="f-year">Рік *</label>
                <input type="number" id="f-year" name="year" required min="1888" max="2100" inputmode="numeric">
              </div>
              <div class="form-group">
                <label for="f-duration">Тривалість, хв *</label>
                <input type="number" id="f-duration" name="duration_min" required min="1" max="1000" inputmode="numeric">
              </div>
            </div>
            <div class="form-group">
              <label for="f-genre">Жанр *</label>
              <select id="f-genre" name="genre_id" required>
                <option value="" disabled selected>Оберіть жанр</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="f-country">Країна</label>
                <input type="text" id="f-country" name="country" maxlength="100">
              </div>
              <div class="form-group">
                <label for="f-director">Режисер</label>
                <input type="text" id="f-director" name="director" maxlength="100">
              </div>
            </div>
            <div class="form-group">
              <label for="f-poster">Постер (URL)</label>
              <input type="url" id="f-poster" name="poster_url" placeholder="https://..." maxlength="2000">
            </div>
            <div class="form-group">
              <label for="f-description">Опис</label>
              <textarea id="f-description" name="description" maxlength="3000"></textarea>
            </div>
            <div class="review-form-actions">
              <button type="submit" class="btn btn-primary" id="movie-submit">Створити</button>
              <button type="button" class="btn btn-ghost" id="movie-cancel" hidden>Скасувати</button>
            </div>
          </form>
        </section>

        <section aria-labelledby="movies-table-title">
          <h2 id="movies-table-title">Усі фільми</h2>
          <div id="movies-table" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>



  <footer>
    <div class="container">
      <div class="footer-inner">
        <div>
          <div class="footer-logo">Cine<span>Mix</span></div>
          <p class="footer-desc">Знаходь фільми, які варто дивитись.</p>
        </div>
        <div class="footer-col">
          <h2>Навігація</h2>
          <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="catalog.html">Каталог</a></li>
            <li><a href="about.html">Про нас</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h2>Проєкт</h2>
          <ul>
            <li><a href="https://github.com/ihor-ci31/cinemix">GitHub</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 Cinemix.</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>

</body>

</html>
