<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог фільмів — Cinemix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalog.css">
  <style>
    .search-bar {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .search-bar input {
      flex: 1;
      padding: 12px 18px;
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-sm);
      color: var(--clr-text);
      font-size: 0.95rem;
      font-family: var(--font-main);
      outline: none;
      transition: border-color var(--transition);
    }
    .search-bar input::placeholder { color: var(--clr-muted); }
    .search-bar input:focus { border-color: var(--clr-accent); }
  </style>
</head>
<body>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="logo">Cine<span>Mix</span></a>
      <nav id="main-nav">
        <ul>
          <li><a href="index.html">Головна</a></li>
          <li><a href="catalog.html" class="active">Каталог</a></li>
          <li><a href="about.html">Про нас</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="register.html" class="btn btn-primary">Приєднатись</a>
      </div>
      <button class="burger" id="burger" aria-label="Меню" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Заголовок каталогу -->
      <div class="catalog-header">
        <h1>Каталог фільмів</h1>
        <p>Знайди свій наступний улюблений фільм</p>
        <form class="search-bar" id="search-form" role="search">
          <input type="search" id="search-input" name="q" maxlength="100" placeholder="Пошук за назвою, режисером, актором..." aria-label="Пошук фільмів">
          <button type="submit" class="btn btn-primary">Знайти</button>
        </form>
        <div class="catalog-toolbar">
          <span id="catalog-summary" aria-live="polite"></span>
          <label class="sort-label">Сортувати:
            <select id="sort-select">
              <option value="title">за назвою</option>
              <option value="rating">за рейтингом</option>
              <option value="year">за роком</option>
              <option value="new">нові надходження</option>
            </select>
          </label>
        </div>
      </div>

      <!-- Фільтри по жанру (завантажуються з /api/genres) -->
      <div class="catalog-filters" id="genre-filters" role="group" aria-label="Фільтр за жанром">
        <button type="button" class="filter-btn active" data-genre="">Всі</button>
      </div>

      <!-- Сітка карток (завантажується з /api/movies) -->
      <div class="movies-grid" id="movies-grid" aria-live="polite"></div>
    </div>
  </main>
  <footer>
    <div class="container">
      <div class="footer-inner">
        <div>
          <div class="footer-logo">Cine<span>Mix</span></div>
          <p class="footer-desc">Знаходь фільми, які варто дивитись.</p>
        </div>
        <div class="footer-col">
          <h2>Навігація</h2>
          <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="catalog.html">Каталог</a></li>
            <li><a href="about.html">Про нас</a></li>
            <li><a href="register.html">Реєстрація</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h2>Жанри</h2>
          <ul>
            <li><a href="catalog.html?genre=scifi">Фантастика</a></li>
            <li><a href="catalog.html?genre=drama">Драма</a></li>
            <li><a href="catalog.html?genre=comedy">Комедія</a></li>
            <li><a href="catalog.html?genre=action">Бойовик</a></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <p>© 2026 Cinemix.</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>

</body>

</html>
